
<!-- slide-select.html — choose a slide (1–6) after story selection -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Select a Slide</title>

  <!-- (optional) your shared styles -->
  <link rel="stylesheet" href="css/sprite-style.css" />

  <style>
    /* Minimal baseline styles so this works out of the box */
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:#0b0b0c; color:#f5f5f7; }
    header { display:flex; align-items:center; gap:.75rem; padding:1rem; border-bottom:1px solid #2a2a2e; }
    header h1 { font-size:1.1rem; margin:0; opacity:.9; }
    header .spacer { flex:1; }
    button, .btn { background:#1f1f23; border:1px solid #2a2a2e; color:#f5f5f7; padding:.55rem .8rem; border-radius:.75rem; cursor:pointer; }
    button:hover, .btn:hover { background:#27272c; }
    main { padding:1rem; max-width:1200px; margin:0 auto; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(180px,1fr)); gap:1rem; }
    .card { background:#141417; border:1px solid #232327; border-radius:1rem; overflow:hidden; display:flex; flex-direction:column; }
    .thumb { aspect-ratio: 4 / 3; background:#0f0f12; display:grid; place-items:center; }
    .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
    .meta { padding:.75rem; display:flex; align-items:center; justify-content:space-between; gap:.5rem; }
    .meta .title { font-weight:600; }
    .meta .num { opacity:.7; font-variant-numeric: tabular-nums; }
    .empty { opacity:.6; font-size:.9rem; }
    footer { padding:1rem; opacity:.7; font-size:.85rem; }
  </style>
</head>
<body>
  <header>
    <button id="backBtn" title="Back to stories">← Back</button>
    <h1>Select a Slide</h1>
    <div class="spacer"></div>
    <div id="storyTag"></div>
  </header>

  <main>
    <div id="grid" class="grid" aria-live="polite"></div>
    <p id="emptyMsg" class="empty" hidden>No slides found.</p>
  </main>

  <footer>
    Tip: we’ll auto-detect slide images at <code>/stories/&lt;story_folder&gt;/slides/1.png…6.png</code>.  
    If a file is missing, you’ll still see a numbered placeholder.
  </footer>

  <!-- Runtime (ESM) -->
  <script type="module" src="js/slide-select.js"></script>
  <noscript>Please enable JavaScript to choose a slide.</noscript>
</body>
</html>
