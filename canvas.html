
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Animation Canvas</title>
  <link rel="stylesheet" href="css/canvas.css" />
</head>
<body>
  <!-- Left navigation toggle button -->
  <button class="toggleNavLeft" aria-label="Toggle tools panel"></button>

  <!-- Sidebar Tools Panel -->
  <nav id="navLeft" aria-label="Drawing tools">
    <!-- ... (unchanged tools markup) ... -->
  </nav>

  <!-- Canvas Layers -->
  <canvas id="bgCanvas"></canvas>
  <canvas id="drawCanvas"></canvas>
  <canvas id="spriteCanvas"></canvas>

  <!-- Mini Live Preview (top-right) -->
  <div id="previewHUD" class="preview-hud">
    <canvas id="previewCanvas" width="320" height="200"></canvas>
  </div>

  <!-- Floating slide nav (bottom-right) -->
  <div class="nav-floating" aria-label="Slide navigation">
    <button id="prevAppBtn" aria-label="Previous scene">◀</button>
    <button id="nextAppBtn" aria-label="Next scene">▶</button>
  </div>

  <!-- Route guard & pass-through context -->
  <script type="module">
    import { readCtx, nextURL } from './js/flow.js';

    const ctx = readCtx();
    if (!ctx.session) { location.replace('index.html'); throw 0; }
    if (!ctx.story)   { location.replace(nextURL('story-select.html', ctx)); throw 0; }
    if (!ctx.slide)   { location.replace(nextURL('slide-select.html', ctx)); throw 0; }  // ✅ require slide
    if (!ctx.char)    { location.replace(nextURL('sprite-select.html', ctx)); throw 0; } // ✅ require character

    // Hand off to canvas.js
    window.__flowCtx = ctx;
  </script>

  <script type="module" src="js/azure-api.js"></script>
  <script type="module" src="js/canvas.js"></script>
</body>
</html>
