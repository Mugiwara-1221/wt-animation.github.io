
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Animation Canvas</title>
  <link rel="stylesheet" href="css/canvas.css" />
</head>
<body>
  <!-- New compact left toolbox -->
  <aside id="toolbox" aria-label="Painting tools">
    <!-- color swatch -->
    <button id="btnColor" class="toolbtn swatch" aria-label="Color">
      <span id="swatch" aria-hidden="true"></span>
    </button>

    <!-- smudge -->
    <button id="btnSmudge" class="toolbtn" aria-label="Smudge">
      <span class="ico ico-smudge" aria-hidden="true"></span>
    </button>

    <!-- eraser -->
    <button id="btnEraser" class="toolbtn" aria-label="Eraser">
      <span class="ico ico-eraser" aria-hidden="true"></span>
    </button>

    <!-- brush -->
    <button id="btnBrush" class="toolbtn" aria-label="Brush">
      <span class="ico ico-brush" aria-hidden="true"></span>
    </button>

    <!-- sliders (shown for brush / eraser / smudge) -->
    <div id="sliders" class="sliders hidden" aria-hidden="true">
      <label class="vslider">
        <input id="sizeSlider" type="range" min="1" max="100" value="18" />
        <span>Size</span>
      </label>
      <label class="vslider">
        <input id="opacitySlider" type="range" min="0" max="1" step="0.01" value="1" />
        <span>Opacity</span>
      </label>
    </div>

    <!-- save menu trigger -->
    <button id="btnSave" class="toolbtn small" aria-label="Save">
      <span class="ico ico-save" aria-hidden="true"></span>
    </button>

    <!-- popups (positioned to the right of the bar) -->
    <div id="popupColor" class="popup hidden" role="dialog" aria-label="Colors">
      <div class="popup-head">Colors</div>
      <div class="popup-body">
        <div id="colorPreview" class="color-preview"></div>
        <!-- Hidden native input; we click it programmatically -->
        <input id="colorInput" type="color" value="#2ad0ff" />
      </div>
    </div>

    <div id="popupBrush" class="popup hidden" role="dialog" aria-label="Brushes">
      <div class="popup-body brush-list">
        <button data-brush="paint"  class="brush-row"><span class="stroke stroke-1"></span>Paintbrush</button>
        <button data-brush="pencil" class="brush-row"><span class="stroke stroke-2"></span>Pencil</button>
        <button data-brush="marker" class="brush-row"><span class="stroke stroke-3"></span>Marker</button>
      </div>
    </div>

    <div id="popupSave" class="popup hidden" role="menu" aria-label="Save Options">
      <div class="popup-body save-list">
        <button id="actDownload">Download Image</button>
        <button id="actStoryboard">Send to Storyboard</button>
      </div>
    </div>
  </aside>

  <!-- Canvas Layers -->
  <canvas id="bgCanvas"></canvas>
  <canvas id="drawCanvas"></canvas>
  <canvas id="spriteCanvas"></canvas>

  <!-- Mini Live Preview (top-right) -->
  <div id="previewHUD" class="preview-hud">
    <canvas id="previewCanvas" width="320" height="200"></canvas>
  </div>

  <!-- Floating slide nav (bottom-right) -->
  <div class="nav-floating" aria-label="Slide navigation">
    <button id="prevAppBtn" aria-label="Previous scene">◀</button>
    <button id="nextAppBtn" aria-label="Next scene">▶</button>
  </div>

  <!-- Route guard & pass-through context -->
  <script type="module">
    import { readCtx, nextURL } from './js/flow.js';
    const ctx = readCtx();
    if (!ctx.session) { location.replace('index.html'); throw 0; }
    if (!ctx.story)   { location.replace(nextURL('story-select.html', ctx)); throw 0; }
    if (!ctx.char)    { location.replace(nextURL('sprite-select.html', ctx)); throw 0; }
    window.__flowCtx = ctx;
  </script>

  <script type="module" src="js/azure-api.js"></script>
  <script type="module" src="js/canvas_demo.js"></script>
</body>
</html>
