
<!-- sprite-select (character selection, story-aware) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character Selection</title>
  <link rel="stylesheet" href="css/sprite-style.css">
</head>
<body>
  <h2>Select your Character!</h2>

  <div class="scene-wrapper" id="characters">
    <!-- Story background -->
    <img id="scene" alt="Scene">
    <!-- Characters injected by JS -->
  </div>

  <!-- Guard: must have story (don’t block on grade) -->
  <script type="module">
    import { readCtx, nextURL } from './js/flow.js';
    const ctx = readCtx();
    if (!ctx.story) location.replace(nextURL('story-select.html', ctx));
  </script>

  <!-- Runtime: load manifest & characters -->
  <script type="module">
    import { readCtx } from './js/flow.js';
    // (grade caps optional; safely ignored if not present)
    // import { getGradeCaps } from './js/grade-config.js';

    const ctx        = readCtx();
    const container  = document.getElementById('characters');
    const sceneImg   = document.getElementById('scene');
    const storyId    = ctx.story; // e.g. "lion-mouse"

    async function loadManifest() {
      const url = `stories/${storyId}/characters.json`;
      try {
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
        return await res.json();
      } catch (err) {
        console.warn('No characters.json for', storyId, err);
        return { background:'', characters:[] };
      }
    }

    function setBackground(paths) {
      const [first, ...rest] = paths;
      if (!first) return;
      sceneImg.src = first;
      sceneImg.onerror = () => setBackground(rest);
    }

    // Simple auto-layout used only when a character has NO x/y/w specified
    function autoPlace(imgs) {
      const n = imgs.length;
      const cols = Math.min(4, n);
      const rows = Math.ceil(n / cols);

      imgs.forEach((img, i) => {
        const r = Math.floor(i / cols);
        const c = i % cols;
        const gap = 6; // %
        const cellW = (100 - (cols + 1) * gap) / cols;
        const cellH = (100 - (rows + 1) * gap) / rows;

        const w = Math.min(22, cellW);
        const x = gap + c * (cellW + gap) + (cellW - w) / 2;
        const y = gap + r * (cellH + gap);

        img.style.position = 'absolute';
        img.style.left  = `${x}%`;
        img.style.top   = `${y}%`;
        img.style.width = `${w}%`;
      });
    }

    (async () => {
      const manifest = await loadManifest();

      // Background
      setBackground([
        manifest.background,
        `images/backgrounds/${storyId}/background.png`,
        'images/backgrounds/tortoise-hare/background.png'
      ].filter(Boolean));

      // Optional grade filter (safe if missing)
      let allowed = null;
      try {
        const caps = await getGradeCaps?.(ctx.grade || 'k-2');
        if (caps?.allowedCharacters?.length) {
          allowed = new Set(caps.allowedCharacters);
        }
      } catch {}

      // Inject characters
      const frag = document.createDocumentFragment();
      const positioned = [];

      for (const c of (manifest.characters || [])) {
        if (allowed && allowed.size && !allowed.has(c.id)) {
          // If using caps, skip only non-allowed ids.
          continue;
        }

        const img = document.createElement('img');
        img.className      = `character ${c.id}`;
        img.dataset.char   = c.id;
        img.dataset.sprite = c.sprite || '';
        img.alt            = c.name || c.id;
        img.draggable      = false;
        img.src            = c.sprite || `images/${c.id}.png`;

        // ✅ Re-enable authoring positions from characters.json
        let hadPos = false;
        img.style.position = 'absolute';
        if (typeof c.x === 'number') { img.style.left   = `${c.x}%`; hadPos = true; }
        if (typeof c.y === 'number') { img.style.top    = `${c.y}%`; hadPos = true; }
        if (typeof c.w === 'number') { img.style.width  = `${c.w}%`; hadPos = true; }
        if (typeof c.z === 'number') { img.style.zIndex = String(c.z); }

        frag.appendChild(img);
        positioned.push({ el: img, hadPos });
      }

      container.appendChild(frag);

      // Only auto-place those that had no x/y/w
      const toAuto = positioned.filter(p => !p.hadPos).map(p => p.el);
      if (toAuto.length) autoPlace(toAuto);

      // Wire click/hover after sprites exist
      await import('./js/sprite-select.js');
    })();
  </script>
</body>
</html>
